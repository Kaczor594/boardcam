[project]
name = "boardcam"
version = "0.1.0"
description = "Clock-triggered over-the-board chess recorder: photos to PGN"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    "python-multipart>=0.0.12",
    "python-chess>=1.999",
    "opencv-python-headless>=4.10",
    "numpy>=2.1",
    "pillow>=11",
    "anthropic>=0.40",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["server", "engine", "synth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: hits the real Anthropic API (costs money)"]
