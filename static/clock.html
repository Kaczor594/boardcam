<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>BoardCam clock</title>
  <link rel="stylesheet" href="/static/css/boardcam.css" />
  <style>
    html, body { height: 100vh; height: 100dvh; overflow: hidden; }

    body.app {
      display: flex;
      flex-direction: column;
    }

    /* ---------- setup screen ---------- */
    #setup {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-5) var(--space-4) var(--space-8);
    }
    #setup .card { max-width: 440px; margin: 0 auto; }
    .player-grid { display: grid; grid-template-columns: 1fr 6.5em; gap: var(--space-2) var(--space-3); }
    .player-grid label { margin: 0; }
    #setup-error { color: var(--negative); font-size: var(--text-sm); }
    .reader-note { font-size: var(--text-xs); color: var(--fg-3); margin-top: var(--space-1); }

    /* ---------- app shell ---------- */
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }

    #setup .eyebrow { margin-bottom: var(--space-2); }
    #custom-fields {
      display: flex;
      gap: var(--space-3);
      margin-top: var(--space-2);
      max-width: 320px;
    }
    #custom-fields label { flex: 1; margin-bottom: 0; }
    .status-strip button.linkish {
      background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit;
      text-decoration: underline; text-underline-offset: 2px; cursor: pointer;
    }

    /* ---------- clock zones ---------- */
    #clock-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .zone {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      background: var(--stone-80);
      color: var(--stone-30);
      transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
    }
    .zone.active {
      background: var(--paper-00);
      color: var(--ink);
    }
    .zone.flagged {
      background: var(--negative) !important;
      color: #fff !important;
    }
    #zone-black { transform: rotate(180deg); }

    .zone-time {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      font-size: clamp(2.5rem, 16vh, 8rem);
      line-height: 1;
      letter-spacing: -0.01em;
    }
    .zone-flag-label {
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: var(--text-lg);
      text-transform: uppercase;
      letter-spacing: var(--tracking-wider);
      margin-top: var(--space-3);
    }
    .zone-inner { display: flex; flex-direction: column; align-items: center; }

    /* ---------- control bar ---------- */
    #control-bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: var(--space-2);
      background: var(--bg-inverse);
      z-index: 5;
    }
    /* The bar sits on the dark surface, so the default paper-coloured button
       would shout louder than Stop, which is the action that matters here. */
    #control-bar .btn {
      flex: 0 0 auto;      /* never stretch to the bar's height */
      align-self: center;
      min-height: 36px;
      padding: var(--space-1) var(--space-3);
      font-size: var(--text-sm);
      color: var(--stone-20);
      background: transparent;
      border-color: var(--stone-60);
    }
    #control-bar .btn:hover:not(:disabled) { background: rgba(248, 245, 238, 0.08); }
    #control-bar .btn:disabled { color: var(--stone-50); border-color: var(--stone-70); }
    #control-bar #stop-btn { color: var(--terra-30); border-color: var(--terra-50); }
    #control-bar #stop-btn:hover:not(:disabled) { background: rgba(185, 111, 62, 0.14); }
    /* The camera is the one action the bar exists for: filled, not outlined. */
    #control-bar #camera-btn {
      color: var(--ink); background: var(--paper-00); border-color: var(--paper-00);
      display: inline-flex; align-items: center; gap: var(--space-2); min-height: 40px;
    }
    #control-bar #camera-btn:hover:not(:disabled) { background: var(--paper-20); }
    #control-bar #camera-btn svg { width: 18px; height: 18px; }
    /* Photo hint: a slow, low-contrast glow once the moves since the last photo
       are getting hard to reconstruct. No text, no sound, no vibration. */
    #control-bar #camera-btn.hint { animation: photo-hint 3.2s ease-in-out infinite; }
    @keyframes photo-hint {
      0%, 100% { box-shadow: 0 0 0 0 rgba(253, 252, 248, 0); }
      50%      { box-shadow: 0 0 0 5px rgba(253, 252, 248, 0.28), 0 0 14px 2px rgba(253, 252, 248, 0.22); }
    }
    @media (prefers-reduced-motion: reduce) {
      #control-bar #camera-btn.hint { animation: none; box-shadow: 0 0 0 4px rgba(253, 252, 248, 0.3); }
    }

    /* ---------- finished banner ---------- */
    #finished-banner, #board-banner {
      position: fixed;
      left: var(--space-3);
      right: var(--space-3);
      top: var(--space-3);
      z-index: 30;
      margin: 0;
      padding: var(--space-3);
      border-radius: var(--radius-md);
      background: var(--terra-50);
      color: var(--paper-00);
      font-size: var(--text-sm);
      text-align: center;
    }

    #finished-banner a { color: inherit; font-weight: 600; }

    /* ---------- photo sheet ---------- */
    #photo-sheet {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: var(--bg);
      overflow-y: auto;
      padding: var(--space-4) var(--space-4) var(--space-8);
    }
    #photo-sheet .sheet-inner { max-width: 460px; margin: 0 auto; }
    #sheet-title { margin: 0; }
    #sheet-meta { font-family: var(--font-mono); font-size: var(--text-sm); color: var(--fg-2); }
    #sheet-thumb {
      display: block; width: 100%; max-height: 28vh; object-fit: contain;
      background: var(--bg-sunken);
    }
    #sheet-reading { color: var(--fg-2); }
    #sheet-flags, #sheet-error {
      font-size: var(--text-sm);
      color: var(--negative);
      border-left: 2px solid var(--negative);
      padding-left: var(--space-3);
    }
    .ply-stepper { display: inline-flex; align-items: center; gap: var(--space-2); }
    .ply-stepper .btn { min-width: 40px; padding: 0; }
    #sheet-ply { min-width: 3.5em; text-align: center; }

    /* The phone lies flat between two players facing each other, so the two
       halves stay stacked in both orientations and the far half stays rotated
       180deg. A landscape row layout would put the players side by side, which
       is not how anyone sits at a board. Only the type scale changes. */
    @media (orientation: landscape) {
      .zone-time { font-size: clamp(2rem, 26vh, 6rem); }
      #control-bar { padding: var(--space-1) var(--space-2); }
      #control-bar .btn { min-height: 32px; }
    }
  </style>
</head>
<body class="app">

  <div id="setup" hidden>
    <div class="card stack">
      <h2>New game</h2>

      <div>
        <div class="eyebrow">Time control</div>
        <div class="chip-row" id="chip-row"></div>
        <button type="button" class="chip" id="chip-custom" aria-pressed="false">Custom</button>
        <div id="custom-fields" hidden>
          <label>Minutes
            <input id="custom-minutes" type="number" min="1" step="1" value="10" inputmode="numeric" />
          </label>
          <label>Increment (s)
            <input id="custom-increment" type="number" min="0" step="1" value="5" inputmode="numeric" />
          </label>
        </div>
      </div>

      <div>
        <div class="eyebrow">Players</div>
        <div class="player-grid">
          <label>White <input id="white-name" type="text" maxlength="40" autocomplete="off" /></label>
          <label>Rating <input id="white-rating" type="number" min="100" max="3500" step="1" inputmode="numeric" /></label>
          <label>Black <input id="black-name" type="text" maxlength="40" autocomplete="off" /></label>
          <label>Rating <input id="black-rating" type="number" min="100" max="3500" step="1" inputmode="numeric" /></label>
        </div>
        <p class="reader-note">Ratings on the chess.com scale. They set how human the guessed moves between photos are.</p>
      </div>

      <div>
        <label>Board reader
          <select id="reader-model"></select>
        </label>
        <p class="reader-note" id="reader-note"></p>
      </div>

      <button id="start-btn" class="btn btn-primary btn-block btn-lg">Set up the clock</button>
      <div id="setup-error" hidden></div>
      <p class="muted" style="font-size: var(--text-sm); margin: 0;"><a href="/games">Recorded games</a></p>
    </div>
  </div>

  <div id="app" hidden>
    <div class="status-strip">
      <span class="status-item"><span class="dot" id="conn-dot"></span>server</span>
      <span class="status-item num" id="ply-label">ply 0</span>
      <span class="status-item"><span class="dot" id="photo-dot"></span><button type="button" class="linkish num" id="photos-label">no photos</button></span>
    </div>

    <div id="clock-area">
      <div class="zone" id="zone-black">
        <div class="zone-inner">
          <div class="zone-time num" id="time-black">10:00</div>
          <div class="zone-flag-label" id="flag-black" hidden>Flag</div>
        </div>
      </div>

      <div id="control-bar">
        <button type="button" class="btn" id="pause-resume-btn" disabled>Pause</button>
        <button type="button" class="btn" id="camera-btn" aria-label="Photograph the board">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          Photo
        </button>
        <button type="button" class="btn btn-danger" id="stop-btn" disabled>Stop</button>
        <button type="button" class="btn" id="new-btn">New</button>
      </div>

      <div class="zone" id="zone-white">
        <div class="zone-inner">
          <div class="zone-time num" id="time-white">10:00</div>
          <div class="zone-flag-label" id="flag-white" hidden>Flag</div>
        </div>
      </div>
    </div>
  </div>

  <input id="camera-input" type="file" accept="image/*" capture="environment" hidden />

  <p id="finished-banner" hidden></p>

  <div id="photo-sheet" hidden>
    <div class="sheet-inner stack">
      <div class="row">
        <h2 id="sheet-title">Photo</h2>
        <span class="spacer"></span>
        <button type="button" class="btn btn-primary" id="sheet-resume">Resume play</button>
      </div>
      <div id="sheet-meta"></div>
      <img id="sheet-thumb" alt="The photo just taken" />

      <p id="sheet-reading" hidden></p>
      <div id="sheet-error" hidden></div>

      <div id="sheet-edit" class="stack" hidden>
        <div id="sheet-flags" hidden></div>
        <div id="sheet-board"></div>
        <p class="muted" style="font-size: var(--text-sm); margin: 0;">Tap a square to change it. Squares you changed are outlined.</p>
        <div class="row">
          <span class="ply-stepper">
            <button type="button" class="btn" id="ply-minus" aria-label="One ply earlier">−</button>
            <span id="sheet-ply" class="num"></span>
            <button type="button" class="btn" id="ply-plus" aria-label="One ply later">+</button>
          </span>
          <span class="spacer"></span>
          <button type="button" class="btn" id="sheet-rotate">Rotate</button>
          <button type="button" class="btn" id="sheet-undo">Undo fixes</button>
        </div>
      </div>

      <div class="row">
        <button type="button" class="btn btn-primary" id="sheet-confirm" hidden>Confirm board</button>
        <button type="button" class="btn" id="sheet-retry" hidden>Read again</button>
        <button type="button" class="btn" id="sheet-retake">Retake</button>
        <button type="button" class="btn" id="sheet-manual" hidden>Enter by hand</button>
        <span class="spacer"></span>
        <button type="button" class="btn" id="sheet-later">Later</button>
      </div>
    </div>
  </div>

  <script type="module" src="/static/js/clock.js"></script>
</body>
</html>
